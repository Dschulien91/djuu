<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Djuu Layout-Varianten</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #F3F6F4; color: #1F2B28; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 18px; color: #61756F; }
  .wrap { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
  figure { margin: 0; flex: none; width: 375px; max-width: calc(100vw - 32px); }
  figcaption { margin-bottom: 8px; }
  figcaption b { display: block; font-size: 16px; }
  iframe { display: block; width: 100%; height: 760px; border: 1px solid #E1E8E5; border-radius: 26px; background: #fff; }
</style>
</head>
<body>
  <h1>Djuu: Layout-Varianten</h1>
  <p>Alle drei sind die echte App, ihr könnt sie direkt anklicken.</p>
  <div class="wrap">
    <figure><figcaption><b>A: Pille und Chips oben</b>Wie bei Airbnb: Zusammenfassung oben, darunter eine Chip-Reihe.</figcaption><iframe src="../index.html?ux=a" title="Variante A"></iframe></figure>
    <figure><figcaption><b>B: Alles unten</b>Pille und Chips direkt über der Liste, gut mit dem Daumen erreichbar.</figcaption><iframe src="../index.html?ux=b" title="Variante B"></iframe></figure>
    <figure><figcaption><b>C: Nur die Pille</b>Am meisten Karte. Kategorien und Tags erst nach dem Hochziehen der Liste.</figcaption><iframe src="../index.html?ux=c" title="Variante C"></iframe></figure>
  </div>
</body>
</html>
