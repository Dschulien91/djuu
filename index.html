<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Djuu Hamburg</title>
  <meta name="description" content="Kurse, Gruppen, Termine und Orte für Familien in Hamburg auf einer Karte.">
  <meta name="theme-color" content="#6B4EE6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Karte"></div>

    <header class="topbar" id="topbar">
      <div class="mapbar" id="mapbar"></div>
      <div class="ctx" id="ctx" aria-label="Auswahl"></div>
    </header>

    <div class="fabs" id="fabs">
      <button type="button" class="fab" id="addFab" data-tab="add" aria-label="Ort eintragen"></button>
      <button type="button" class="fab" id="locate" aria-label="Mein Standort"></button>
      <button type="button" class="fab sos" id="sos" aria-label="Dringend: nächstes WC, Wickeltisch, Windeln oder Apotheke"></button>
    </div>

    <section class="panel" id="panel" data-size="peek" aria-label="Orte">
      <div class="grip" id="grip" aria-hidden="true"><i></i></div>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  </div>

  <div class="splash" id="splash">
    <div class="balls" aria-hidden="true"><div class="ball" style="right:-50px;top:-90px;width:200px;height:200px;background:#FFD166"><i></i></div><div class="ball" style="left:28px;top:90px;width:56px;height:56px;background:#FFB3CC"><i></i></div><div class="ball" style="left:-70px;bottom:90px;width:180px;height:180px;background:#7FE0D4"><i></i></div><div class="ball" style="right:34px;bottom:130px;width:84px;height:84px;background:#C9BDFF;opacity:0.6"><i></i></div></div>
    <span class="logo" role="img" aria-label="djuu"><span style="color:#FFFFFF">d</span><span style="color:#FFD166">j</span><span style="color:#7FE0D4">u</span><span style="color:#FFB3CC">u</span>
          <svg viewBox="18 92 78 34" style="position:absolute;right:.225em;top:.84em;width:.482em;height:.21em;overflow:visible" aria-hidden="true"><path d="M20 112 C38 130 66 114 92 97" fill="none" stroke="#FFD166" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 17"/></svg>
          <svg viewBox="-40 -48 80 96" style="position:absolute;right:.04em;top:.39em;width:.42em;height:.5em;overflow:visible" aria-hidden="true"><g transform="rotate(-14 0 44)"><path d="M0 -44 C-24 -44 -36 -26 -36 -10 C-36 14 0 44 0 44 C0 44 36 14 36 -10 C36 -26 24 -44 0 -44 Z" fill="#FFFFFF"/><circle cx="0" cy="-10" r="15" fill="#6B4EE6"/></g></svg></span>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="i18n/i18n.js"></script>
  <script src="i18n/en.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ask.js"></script>
  <script src="family.js"></script>
  <script src="sync.js"></script>
  <script src="wir.js"></script>
  <script src="looks.js"></script>
</body>
</html>
