<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Djuu Hamburg</title>
  <meta name="description" content="Alle Orte für Familien in Hamburg auf einer Karte – mit Filtern für Wickeltisch, Hund, Kinderwagen und Öffnungszeiten.">
  <meta name="theme-color" content="#0E4D45">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Karte"></div>

    <header class="topbar" id="topbar">
      <div class="row ctx" id="ctx" aria-label="Kategorien und Tags"></div>
    </header>

    <div class="fabs" id="fabs">
      <button type="button" class="fab" id="filterBtn" data-open="filters" aria-label="Filter"></button>
      <button type="button" class="fab" id="addFab" data-tab="add" aria-label="Ort eintragen"></button>
      <button type="button" class="fab" id="locate" aria-label="Mein Standort"></button>
      <button type="button" class="fab sos" id="sos" aria-label="Dringend: nächstes WC, Wickeltisch, Windeln oder Apotheke"></button>
    </div>

    <section class="panel" id="panel" data-size="peek" aria-label="Orte">
      <div class="grip" id="grip" aria-hidden="true"><i></i></div>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
